name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly: surface ecosystem drift on quiet repos

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: gojiplus/py-canon/.github/workflows/reusable-ci.yml@v1
    with:
      # requires-python floors at 3.12, so the reusable default of
      # ["3.11", "3.14"] cannot resolve its first leg.
      python-versions: '["3.12", "3.13", "3.14"]'
      wheel-import: optimal_cutoffs
      # The reusable lint job derives the package directory from the
      # distribution name, so it looks for optimal_classification_cutoffs/ and
      # errors out; the import name is optimal_cutoffs, set through
      # [tool.uv.build-backend] module-name, which it does not consult. Run it
      # locally with `uvx --from pydoclint==0.9.1 pydoclint optimal_cutoffs`
      # until reusable-ci learns to read module-name.
      run-pydoclint: false
      coverage-floor: 65
      run-preen: true
