name: Docs

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: gojiplus/py-canon/.github/workflows/reusable-docs.yml@v1
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      deploy: ${{ github.event_name == 'push' }}
      # The `>>>` blocks in the API docstrings are illustrative sketches, not
      # runnable sessions: they reference names defined nowhere and use a
      # literal `...` inside array literals. 37 of the 48 collected doctests
      # fail. Turning them into real examples is a docs project of its own;
      # until then the builder would only ever be red.
      run-doctests: false
